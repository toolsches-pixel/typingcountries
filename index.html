<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apna word · typing test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-serika-dark">

<button class="theme-toggle-btn" id="themeToggleBtn" title="Change theme">theme</button>

<div class="theme-panel" id="themePanel">
    <div class="theme-panel-label">theme</div>
    <div class="theme-swatch active" data-theme="serika-dark"></div>
    <div class="theme-swatch" data-theme="serika-light"></div>
    <div class="theme-swatch" data-theme="dracula"></div>
    <div class="theme-swatch" data-theme="nord"></div>
    <div class="theme-swatch" data-theme="solarized"></div>
    <div class="theme-swatch" data-theme="rose"></div>
    <div class="theme-swatch" data-theme="cobalt"></div>
    <div class="theme-swatch" data-theme="matrix"></div>
    <div class="theme-swatch" data-theme="80s"></div>
    <div class="theme-swatch" data-theme="botanical"></div>
</div>

<div class="top-bar">
    <div class="logo">
        ⌨️ apna word
        <span class="logo-sub" id="wordCountBadge">countries</span>
    </div>
    <div class="top-controls">
        <span class="progress-info" id="progressBadge">1 / 0</span>
        <span class="timer-display" id="timerDisplay">00:00.0</span>
        <button class="icon-btn" id="speakToggle" title="Toggle voice">🔊</button>
    </div>
</div>

<div class="typing-area">
    <div class="word-stream-wrapper" id="wordStreamPanel">
        <div class="word-stream" id="wordStream"></div>
    </div>
    <input type="text" id="typingInput" class="typing-input" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" autofocus>

    <div class="hint-text">
        <kbd>Space</kbd> next (jab sahi type ho) · <kbd>Enter</kbd> skip · <kbd>Alt</kbd>+<kbd>S</kbd> skip
    </div>
</div>

<div class="bottom-bar">
    <button class="bottom-btn" id="skipBtn" title="Skip word (Alt+S)">
        <span>⏭</span>
        <span class="btn-label">skip</span>
    </button>
    <button class="bottom-btn" id="speakBtn" title="Speak current word">
        <span>🔊</span>
        <span class="btn-label">speak</span>
    </button>
    <button class="bottom-btn" id="restartBtn" title="Restart test">
        <span>⟳</span>
        <span class="btn-label">restart</span>
    </button>
</div>

<div id="messageBox" class="message-box"></div>

<div class="result-overlay" id="resultOverlay">
    <div class="result-card">
        <h2>test complete</h2>

        <div class="result-main-stats">
            <div class="result-main-stat">
                <div class="rms-value" id="finalWpm">0</div>
                <div class="rms-label">wpm</div>
            </div>
            <div class="result-main-stat">
                <div class="rms-value time-value" id="finalTime">00:00</div>
                <div class="rms-label">time</div>
            </div>
        </div>

        <div class="result-secondary-stats">
            <div class="result-secondary-stat">
                <div class="rss-label">accuracy</div>
                <div class="rss-value green" id="finalAccuracy">100%</div>
            </div>
            <div class="result-secondary-stat">
                <div class="rss-label">errors</div>
                <div class="rss-value red" id="finalErrors">0</div>
            </div>
            <div class="result-secondary-stat">
                <div class="rss-label">skipped</div>
                <div class="rss-value yellow" id="finalSkipped">0</div>
            </div>
        </div>

        <div class="result-actions">
            <button class="btn-primary" id="playAgainBtn">
                <span>⟳</span> next test
            </button>
            <button class="btn-secondary" id="closeResultBtn">
                close
            </button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
